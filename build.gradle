import org.gradle.internal.jvm.Jvm

buildscript {
    ext {
        flywayVersion = "11.1.1"
        mapstructVersion = "1.6.3"
        lombokVersion = "1.18.36"
    }
}

plugins {
    id "org.springframework.boot" version "3.4.1"
    id "io.spring.dependency-management" version "1.1.7"
    id "java"
    id "org.flywaydb.flyway" version "${flywayVersion}"
    id "jacoco"
    id "com.github.ben-manes.versions" version "0.51.0"
}

println "Running gradle version: $gradle.gradleVersion"
println "gradle home dir: $gradle.gradleHomeDir"
def currentJvm = Jvm.current()
println "java: ${JavaVersion.current()}"
println currentJvm


flyway {
    url = "jdbc:postgresql://localhost:5432/alkis_data"
    user = "postgres"
    password = "admin"
    table = "schema_version"
    baselineVersion = 0
    baselineDescription = "Spring Batch tables"
}

group = "com.poker.alkis"
version = "0.0.1-SNAPSHOT"
java {
    sourceCompatibility = JavaVersion.VERSION_21
}


jar {
    enabled = false
}

repositories {
    mavenCentral()
}

dependencies {
    implementation "org.springframework.boot:spring-boot-starter-data-jpa"
    implementation "org.springframework.boot:spring-boot-starter-web"
    implementation "org.springframework.boot:spring-boot-starter-web-services"
    implementation "org.springframework.boot:spring-boot-starter-validation"
    implementation "org.springframework.integration:spring-integration-ftp"

    implementation "org.flywaydb:flyway-core:${flywayVersion}"
    implementation "org.flywaydb:flyway-database-postgresql:${flywayVersion}"
    implementation "org.postgresql:postgresql:42.7.4"

    implementation "net.datafaker:datafaker:2.4.2"
    implementation "org.apache.commons:commons-lang3:3.17.0"

    compileOnly "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"

    implementation "org.mapstruct:mapstruct:${mapstructVersion}"
    annotationProcessor "org.mapstruct:mapstruct-processor:${mapstructVersion}"

    testImplementation "org.springframework.boot:spring-boot-starter-test"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

jacoco {
    toolVersion = "0.8.12"
}

jacocoTestReport {
    dependsOn test
}
